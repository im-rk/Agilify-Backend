spring.application.name=agilify-core
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/bugtracker
spring.datasource.username=bugtracker_user
spring.datasource.password=bugtracker_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
# Base64 encoded secret for JWT (minimum 256 bits/32 bytes length)
jwt.secret=9B9C4A21A1A5B4D2423F9742E943D5C588726DB7A13B9B253D74DE79D5F4D3C4
jwt.expiry-hours=24

# Springdoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true


# Keycloak JWT validation (issuer must match the "iss" claim of tokens; realm name is an assumption)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/agilify}

# CRDT doc WebSocket (/ws/docs/{docId}) allowed browser origins
websocket.allowed-origins=http://localhost:3000,http://localhost:5173

# Semantic issue dedup - local Ollama embeddings (free, no API key) + pgvector
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
