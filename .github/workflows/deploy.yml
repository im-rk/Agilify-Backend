name: CI/CD

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 204810699146.dkr.ecr.ap-northeast-1.amazonaws.com
  INSTANCE_ID: i-07bb832ffc973f55f

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: Flyway V6 runs CREATE EXTENSION vector
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: bugtracker_user
          POSTGRES_PASSWORD: bugtracker_password
          POSTGRES_DB: bugtracker
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U bugtracker_user -d bugtracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::204810699146:role/agilify-gha-backend
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t "$ECR_REGISTRY/agilify-core:latest" -t "$ECR_REGISTRY/agilify-core:${GITHUB_SHA::12}" .
          docker push "$ECR_REGISTRY/agilify-core:latest"
          docker push "$ECR_REGISTRY/agilify-core:${GITHUB_SHA::12}"
      - name: Deploy on the server (SSM) and wait
        run: |
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --timeout-seconds 600 \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/agilify/deploy.sh"]' \
            --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -60
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -5
