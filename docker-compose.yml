version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bugtracker-postgres
    environment:
      POSTGRES_USER: bugtracker_user
      POSTGRES_PASSWORD: bugtracker_password
      POSTGRES_DB: bugtracker
    ports:
      - "5434:5432"
    volumes:
      - bugtracker_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bugtracker-redis
    ports:
      - "6381:6379"
    volumes:
      - bugtracker_redisdata:/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: bugtracker-keycloak
    # --import-realm creates the 'agilify' realm, the agilify-app client and users alice/bob/carol
    # (password Passw0rd!) on first start. If the realm already exists it is left untouched.
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/agilify-realm.json:/opt/keycloak/data/import/agilify-realm.json:ro
    restart: unless-stopped

volumes:
  bugtracker_pgdata:
  bugtracker_redisdata:
  keycloak_data:
